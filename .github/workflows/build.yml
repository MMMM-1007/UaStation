name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release ${{ matrix.platform }}
        run: msbuild Ua.slnx /p:Configuration=Release /p:Platform=${{ matrix.platform }} /m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ua-${{ matrix.platform }}-${{ github.ref_name }}
          path: ${{ matrix.platform }}/Release/Ua.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Ua-x64-${{ github.ref_name }}
          path: dist/x64

      - uses: actions/download-artifact@v4
        with:
          name: Ua-ARM64-${{ github.ref_name }}
          path: dist/arm64

      - name: Rename artifacts
        run: |
          mv dist/x64/Ua.exe Ua-x64.exe
          mv dist/arm64/Ua.exe Ua-ARM64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Ua-x64.exe
            Ua-ARM64.exe
          generate_release_notes: true
